<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kyoto · DevTools</title>
  <!-- DevTools panels can't iframe in another extension page directly,
       so we load the sidepanel CSS + scripts and reuse the markup
       fragment. To keep things simple we just iframe the side panel
       URL — chrome-extension:// allows same-origin iframing within
       the extension. -->
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0e0e10; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <iframe src="../sidepanel/sidepanel.html"></iframe>
</body>
</html>
