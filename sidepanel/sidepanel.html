<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PageChat</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="hdr">
    <div class="hdr-l">
      <div class="brand">PageChat</div>
      <div class="model-line" id="modelLine">—</div>
    </div>
    <div class="hdr-r">
      <button class="ibtn" id="newChatBtn" title="New chat">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="ibtn" id="settingsBtn" title="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="ctxbar">
    <span class="dot" id="ctxDot"></span>
    <span class="ctx-txt" id="ctxTxt">No page</span>
    <button class="ctx-reload" id="reloadCtxBtn" title="Re-read page">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </button>
  </div>

  <main class="chat" id="chat">
    <div class="empty" id="empty">
      <h2>Ask anything about this page</h2>
      <p>Bring your own key from OpenRouter or DeepSeek. Pick a model. Chat.</p>
      <div class="chips">
        <button class="chip" data-prompt="Summarize this page in 5 bullet points.">Summarize</button>
        <button class="chip" data-prompt="What are the key takeaways?">Key takeaways</button>
        <button class="chip" data-prompt="Explain the main concept in simple terms.">Explain simply</button>
        <button class="chip" data-prompt="Extract any code, commands, or data tables from this page.">Extract code/data</button>
      </div>
    </div>
  </main>

  <footer class="composer">
    <div class="composer-box">
      <textarea id="input" rows="1" placeholder="Ask about this page…"></textarea>
      <div class="composer-row">
        <label class="ctx-toggle" title="Include page content as context">
          <input type="checkbox" id="useContext" checked />
          <span>Page context</span>
        </label>
        <div class="composer-spacer"></div>
        <button id="stopBtn" class="btn-stop hidden" title="Stop generating">Stop</button>
        <button id="sendBtn" class="btn-send" title="Send (Enter)">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </footer>

  <!-- Settings drawer -->
  <div class="overlay hidden" id="overlay"></div>
  <aside class="drawer hidden" id="drawer">
    <header class="drawer-hdr">
      <h2>Settings</h2>
      <button class="ibtn" id="closeDrawerBtn" title="Close">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </header>

    <div class="drawer-body">
      <div class="field">
        <label>Provider</label>
        <select id="provider">
          <option value="openrouter">OpenRouter</option>
          <option value="deepseek">DeepSeek</option>
        </select>
      </div>

      <div class="field">
        <label id="keyLabel">OpenRouter API key</label>
        <div class="input-wrap">
          <input type="password" id="apiKey" placeholder="sk-or-v1-…" autocomplete="off" />
          <button class="reveal" id="revealBtn" type="button" title="Show/hide">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="hint" id="keyHint">
          Get a key at <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a>.
        </p>
      </div>

      <div class="field">
        <label>Model</label>
        <div class="input-wrap">
          <input type="text" id="modelSearch" placeholder="Search models…" autocomplete="off" />
        </div>
        <select id="model" size="8"></select>
        <p class="hint" id="modelHint">Enter an API key to load models.</p>
      </div>

      <div class="field">
        <label>System prompt (optional)</label>
        <textarea id="systemPrompt" rows="3" placeholder="You are a helpful assistant…"></textarea>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Temperature</label>
          <input type="number" id="temperature" min="0" max="2" step="0.1" value="0.7" />
        </div>
        <div class="field">
          <label>Max tokens</label>
          <input type="number" id="maxTokens" min="64" max="32000" step="64" value="4096" />
        </div>
      </div>

      <button class="btn-primary" id="saveBtn">Save</button>
      <p class="status" id="saveStatus"></p>
    </div>
  </aside>

  <script src="../lib/marked.min.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
